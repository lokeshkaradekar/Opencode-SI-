name: Bug report
description: Report a reproducible problem in OpenCode SI.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please check the README and troubleshooting guide first. Never include API keys, passwords, daemon tokens, private source code, or unredacted logs.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behaviour and what you expected instead.
      placeholder: Clear, concise description
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the exact steps and whether this happens on a fresh test project.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Tap ...
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source revision
      description: Commit hash or source bundle version, if known.
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Device model; Android version
  - type: input
    id: architecture
    attributes:
      label: CPU architecture
      placeholder: ARM64, ARM32, x86_64, or unknown
  - type: input
    id: termux
    attributes:
      label: Termux version and source
      placeholder: Version; F-Droid or official GitHub release
  - type: input
    id: sketchware
    attributes:
      label: Sketchware Pro version
      description: If applicable.
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste relevant error text or logs after removing secrets and personal paths.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed credentials, tokens, personal data, and private project details.
          required: true
